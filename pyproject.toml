[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oklchsv"
version = "0.1.0"
description = "Closed-form and spectral scotopic-to-photopic (S/P) ratio, with D65 adaptation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "nekotrack" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
scripts = ["scipy>=1.9", "colour-science==0.4.7"]

[project.urls]
Paper = "https://arxiv.org/abs/2609.24819"

[tool.setuptools]
packages = ["oklchsv"]
